<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1026" />
  <meta name="description" content="Un jardín interactivo de recuerdos y logros." />
  <title>🌸 Jardín de Recuerdos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Cielo: estrellas, luna y estrellas fugaces -->
  <div class="sky" id="sky">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
  </div>

  <!-- Canvas para partículas -->
  <canvas id="particles"></canvas>

  <!-- Jardín -->
  <main class="garden" id="garden" aria-label="Jardín interactivo de recuerdos"></main>
<!-- Texto fijo inferior -->
<footer class="footer-note" id="footerNote">
    <p>Solo hay una pequeña parte del universo de la que sabrás con certeza que puede ser mejorada, y esa parte... eres tú. </p>
    Hecho con 💜 para ti — <span class="accent">toca una flor</span></p>
</footer>
  <!-- Tarjeta de recuerdo -->
  <div class="card-overlay" id="cardOverlay" aria-hidden="true">
    <article class="memory-card" id="memoryCard" role="dialog" aria-modal="true">
      <button class="close-btn" id="closeBtn" type="button" aria-label="Cerrar">✕</button>
      <div class="card-image">
        <img id="cardImg" src="" alt="" />
      </div>
      <div class="card-content">
        <h2 id="cardTitle"></h2>
        <p id="cardText"></p>
        <span class="card-tag" id="cardTag"></span>
      </div>
    </article>
  </div>

  <!-- Visor de imagen completa -->
  <div class="img-viewer" id="imgViewer" aria-hidden="true">
    <img id="viewerImg" src="" alt="" />
    <button class="close-btn" id="viewerClose" type="button" aria-label="Cerrar imagen">✕</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
